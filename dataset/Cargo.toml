[package]
name = "open-arrow-access-dataset"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sequential file-set and directory datasets for Open Arrow Access"

[features]
default = []
directory = []

[dependencies]
open-arrow-access-core.workspace = true
futures.workspace = true

[dev-dependencies]
open-arrow-access-file-format = { workspace = true, features = ["atif", "parquet"] }
open-arrow-access-storage.workspace = true
tempfile.workspace = true
more-asserts.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
open-arrow-access-test-support.workspace = true
tokio.workspace = true

[[test]]
name = "directory"
required-features = ["directory"]

[lints]
workspace = true

[[test]]
name = "directory_parquet"
required-features = ["directory"]

[[test]]
name = "atif"
required-features = ["directory"]
