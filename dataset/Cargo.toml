[package]
name = "open-arrow-access-dataset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Sequential file-set and directory datasets for Open Arrow Access"

[features]
default = []

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
futures.workspace = true
glob.workspace = true
open-arrow-access-core.workspace = true
open-arrow-access-decompression.workspace = true
open-arrow-access-file-format.workspace = true
percent-encoding.workspace = true
url.workspace = true

[dev-dependencies]
flate2.workspace = true
more-asserts.workspace = true
open-arrow-access-decompression = { path = "../decompression", default-features = false, features = [
    "gzip",
] }
open-arrow-access-file-format = { path = "../file-format", default-features = false, features = [
    "atif",
    "csv",
    "json",
    "parquet",
    "warc",
] }
open-arrow-access-layers = { workspace = true, features = ["parallel-read", "unordered-emission"] }
open-arrow-access-storage.workspace = true
open-arrow-access-test-support.workspace = true
parquet.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "time"] }

[lints]
workspace = true
