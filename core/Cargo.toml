[package]
name = "open-arrow-access-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared reader, accessor, and layer contracts for Open Arrow Access"

[features]
default = []
record-batch-builder = ["dep:serde", "dep:serde_arrow", "dep:marrow"]

[dependencies]
serde = { workspace = true, optional = true }
serde_arrow = { workspace = true, optional = true }
marrow = { workspace = true, optional = true, features = ["arrow-59"] }
arrow-array.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true

[[test]]
name = "record_batch_builder"
required-features = ["record-batch-builder"]
