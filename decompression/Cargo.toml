[package]
name = "open-arrow-access-decompression"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Streaming byte decompression layers for Open Arrow Access"

[features]
bz2 = ["dep:async-compression", "async-compression/bzip2"]
default = []
gzip = ["dep:async-compression", "async-compression/gzip"]
lz4 = ["dep:async-compression", "async-compression/lz4"]
tar = ["dep:tar"]
zip = ["dep:async_zip"]
zstd = ["dep:async-compression", "async-compression/zstd"]

[dependencies]
async-compression = { workspace = true, optional = true }
async_zip = { workspace = true, optional = true }
futures.workspace = true
open-arrow-access-core.workspace = true
tar = { workspace = true, optional = true }

[dev-dependencies]
more-asserts.workspace = true
open-arrow-access-test-support.workspace = true
tokio.workspace = true

[[test]]
name = "bz2"
required-features = ["bz2"]

[[test]]
name = "gzip"
required-features = ["gzip"]

[[test]]
name = "lz4"
required-features = ["lz4"]

[[test]]
name = "zstd"
required-features = ["zstd"]

[lints]
workspace = true

[[test]]
name = "zip"
required-features = ["zip"]

[[test]]
name = "tar"
required-features = ["tar"]

[package.metadata.docs.rs]
all-features = true
