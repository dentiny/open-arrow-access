[package]
name = "open-arrow-access-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Dataset source providers for Open Arrow Access"

[features]
default = []
pmc = ["dep:arrow-array", "dep:arrow-schema", "dep:futures", "dep:serde", "dep:serde_json", "dep:percent-encoding", "dep:open-arrow-access-file-format", "open-arrow-access-file-format/json"]
commoncrawl = ["dep:open-arrow-access-storage", "dep:opendal", "dep:opendal-service-http", "dep:url"]

[dependencies]
open-arrow-access-file-format = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }

open-arrow-access-core.workspace = true
open-arrow-access-storage = { workspace = true, optional = true }
opendal = { workspace = true, features = ["services-http", "http-transport-reqwest"], optional = true }
opendal-service-http = { version = "=0.59.2", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
open-arrow-access-decompression = { workspace = true, features = ["gzip"] }
open-arrow-access-test-support.workspace = true
open-arrow-access-storage = { workspace = true, features = ["fs"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["fs"] }

[[test]]
name = "pmc"
required-features = ["pmc"]

[lints]
workspace = true
