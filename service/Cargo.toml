[package]
name = "open-arrow-access-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider-specific dataset discovery for Open Arrow Access"

[features]
default = []
huggingface = [
    "dep:open-arrow-access-storage",
    "dep:opendal", "opendal/services-hf", "opendal/http-transport-reqwest",
    "dep:tokio", "dep:http", "dep:serde", "dep:serde_json", "dep:url", "dep:glob",
]

[dependencies]
open-arrow-access-core.workspace = true
open-arrow-access-storage = { workspace = true, optional = true }
opendal = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
http = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
url = { version = "2", optional = true }
glob = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "sync", "time"] }
futures.workspace = true
arrow-array.workspace = true
open-arrow-access-file-format = { workspace = true, features = ["parquet"] }

[lints]
workspace = true
