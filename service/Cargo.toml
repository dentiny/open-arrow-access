[package]
name = "open-arrow-access-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Dataset source providers for Open Arrow Access"

[features]
arxiv = [
    "dep:arrow-cast",
    "tokio/rt",
    "oai",
    "format-xml",
    "dep:arrow-select",
    "dep:open-arrow-access-decompression",
    "open-arrow-access-decompression/tar",
    "open-arrow-access-decompression/gzip",
]
bhl = [
    "tokio/fs",
    "tokio/sync",
    "opendal/services-s3",
    "dep:arrow-cast",
    "dep:sha2",
    "dep:regex",
    "dep:open-arrow-access-decompression",
    "open-arrow-access-decompression/gzip",
    "open-arrow-access-file-format/csv",
]
biorxiv = ["meca", "dep:chrono"]
courtlistener = [
    "arrow-array/chrono-tz",
    "dep:open-arrow-access-decompression",
    "open-arrow-access-decompression/bz2",
    "dep:arrow-cast",
    "duckdb/appender-arrow",
    "tokio/rt",
    "tokio/sync",
]
dataverse = []
default = ["duckdb-bundled"]
doab = ["oai"]
duckdb-bundled = ["duckdb/bundled"]
federal-register = []
figshare = []
govinfo = []
gutenberg = ["format-xml", "dep:chrono"]
hathifiles = []
huggingface = [
    "opendal/services-hf",
    "tokio/fs",
    "open-arrow-access-file-format/parquet",
    "dep:percent-encoding",
]
internet-archive = []
library-of-congress = []
meca = [
    "format-xml",
    "dep:percent-encoding",
    "dep:open-arrow-access-decompression",
    "open-arrow-access-decompression/zip",
]
oapen = ["oai"]
openstax = []
pmc = [
    "dep:percent-encoding",
    "opendal/services-s3",
    "dep:arrow-json",
    "open-arrow-access-file-format/csv",
    "open-arrow-access-file-format/json",
    "dep:open-arrow-access-decompression",
    "open-arrow-access-decompression/gzip",
]
regulations = []
semantic-scholar = [
    "open-arrow-access-file-format/json",
    "open-arrow-access-layers/schema-evolution",
]
uspto = []
warc = ["open-arrow-access-file-format/warc"]
zenodo = []

format-xml = [
    "dep:quick-xml",
    "open-arrow-access-file-format/xml",
]
oai = ["format-xml"]

[dependencies]
tempfile.workspace = true
# Keep DuckDB on the Arrow 58 binding line used by the public workspace.
duckdb = { version = "~1.10506.1", default-features = false, features = ["bundled", "appender-arrow", "parquet"] }
arrow-cast = { workspace = true, optional = true }
sha2 = { version = "0.11", optional = true }
regex = { workspace = true, optional = true }

arrow-array.workspace = true
arrow-json = { workspace = true, optional = true }
arrow-select = { workspace = true, optional = true }
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep"] }
chrono = { workspace = true, optional = true }
futures.workspace = true
http.workspace = true
httpdate = "1"
open-arrow-access-core.workspace = true
open-arrow-access-layers = { workspace = true, optional = true }
open-arrow-access-dataset.workspace = true
open-arrow-access-decompression = { workspace = true, optional = true }
open-arrow-access-file-format.workspace = true
open-arrow-access-storage.workspace = true
opendal = { workspace = true, features = ["services-http", "http-transport-reqwest"] }
opendal-http-transport-reqwest.workspace = true
opendal-service-http.workspace = true
percent-encoding = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
url.workspace = true

arrow-schema.workspace = true

[dev-dependencies]
tar.workspace = true
async-compression = { workspace = true, features = ["bzip2"] }
more-asserts.workspace = true
open-arrow-access-file-format = { path = "../file-format", default-features = false, features = [
    "csv",
    "json",
    "parquet",
] }
open-arrow-access-layers = { workspace = true, features = [
    "parallel-read",
    "missing-object",
] }

arrow-array.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
futures.workspace = true
open-arrow-access-test-support.workspace = true

open-arrow-access-decompression = { path = "../decompression", default-features = false, features = [
    "gzip",
    "zip",
] }
rstest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs"] }
[[test]]
name = "huggingface"
required-features = ["huggingface"]

[[test]]
name = "gutenberg"
required-features = ["gutenberg"]

[[test]]
name = "pmc_inventory"
required-features = ["pmc"]

[[test]]
name = "pmc"
