[package]
name = "open-arrow-access-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Dataset source providers for Open Arrow Access"

[features]
record-files = ["dep:open-arrow-access-dataset", "open-arrow-access-dataset/directory", "dep:open-arrow-access-file-format"]
arxiv = [
    "oai",
    "format-xml",
    "dep:open-arrow-access-decompression",
    "open-arrow-access-decompression/tar",
]
bhl = ["figshare", "record-files"]
biorxiv = ["meca", "dep:chrono"]
courtlistener = ["dep:open-arrow-access-decompression", "open-arrow-access-decompression/bz2"]
dataverse = []
default = []
doab = ["oai"]
federal-register = []
figshare = []
govinfo = []
gutenberg = ["format-xml", "dep:chrono"]
hathifiles = []
huggingface = [
    "dep:open-arrow-access-dataset",
    "dep:open-arrow-access-file-format",
    "opendal/services-hf",
    "dep:tokio",
    "tokio/fs",
    "open-arrow-access-dataset/directory",
    "open-arrow-access-file-format/parquet",
]
internet-archive = []
library-of-congress = []
meca = [
    "format-xml",
    "dep:percent-encoding",
    "dep:open-arrow-access-decompression",
    "open-arrow-access-decompression/zip",
]
oapen = ["oai"]
openstax = []
pmc = [
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:open-arrow-access-file-format",
    "open-arrow-access-file-format/csv",
    "open-arrow-access-file-format/json",
    "dep:open-arrow-access-decompression",
    "open-arrow-access-decompression/gzip",
]
regulations = []
semantic-scholar = []
uspto = []
warc = ["dep:open-arrow-access-dataset", "open-arrow-access-dataset/directory", "dep:open-arrow-access-file-format", "open-arrow-access-file-format/warc"]
zenodo = []

format-xml = [
    "dep:quick-xml",
    "dep:open-arrow-access-file-format",
    "open-arrow-access-file-format/xml",
    "dep:arrow-array",
    "dep:arrow-schema",
]
oai = ["format-xml"]

[dependencies]
arrow-array = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
futures.workspace = true
http.workspace = true
open-arrow-access-core.workspace = true
open-arrow-access-dataset = { workspace = true, optional = true }
open-arrow-access-decompression = { workspace = true, optional = true }
open-arrow-access-file-format = { workspace = true, optional = true }
open-arrow-access-storage.workspace = true
opendal = { workspace = true, features = ["services-http", "http-transport-reqwest"] }
opendal-http-transport-reqwest.workspace = true
opendal-service-http.workspace = true
percent-encoding = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
url.workspace = true

arrow-schema = { workspace = true, optional = true }

[dev-dependencies]
open-arrow-access-file-format = { workspace = true, features = ["json"] }
open-arrow-access-layers.workspace = true

arrow-array.workspace = true
arrow-schema.workspace = true
futures.workspace = true
open-arrow-access-test-support.workspace = true

open-arrow-access-decompression = { workspace = true, features = ["gzip", "zip"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["fs"] }
[[test]]
name = "huggingface"
required-features = ["huggingface"]

[[test]]
name = "gutenberg"
required-features = ["gutenberg"]

[[test]]
name = "pmc_inventory"
required-features = ["pmc"]

[[test]]
name = "pmc"
required-features = ["pmc"]

[[test]]
name = "courtlistener"
required-features = ["courtlistener"]

[lints]
workspace = true

[[test]]
name = "commoncrawl"
required-features = ["warc"]

[[test]]
name = "warc"
required-features = ["warc"]

[[test]]
name = "commoncrawl_segment"
required-features = ["warc"]

[[test]]
name = "zenodo"
required-features = ["zenodo"]

[[test]]
name = "dataverse"
required-features = ["dataverse"]

[[test]]
name = "arxiv"
required-features = ["arxiv"]

[[test]]
name = "internet_archive"
required-features = ["internet-archive"]

[[test]]
name = "xml_metadata"
required-features = ["format-xml"]

[[test]]
name = "uspto"
required-features = ["uspto"]

[[test]]
name = "oai"
required-features = ["oai"]

[[test]]
name = "oai_provider"
required-features = ["oai"]

[[test]]
name = "hathifiles"
required-features = ["hathifiles"]

[[test]]
name = "federal_register"
required-features = ["federal-register"]

[[test]]
name = "govinfo"
required-features = ["govinfo"]

[[test]]
name = "oapen"
required-features = ["oapen"]

[[test]]
name = "figshare"
required-features = ["figshare"]

[[test]]
name = "library_of_congress"
required-features = ["library-of-congress"]

[[test]]
name = "meca"
required-features = ["meca"]

[[test]]
name = "biorxiv"
required-features = ["biorxiv"]

[[test]]
name = "openstax"
required-features = ["openstax"]

[[test]]
name = "semantic_scholar"
required-features = ["semantic-scholar"]

[[test]]
name = "bhl"
required-features = ["bhl"]

[[test]]
name = "regulations"
required-features = ["regulations"]

[[test]]
name = "record_files"
required-features = ["record-files"]

[[test]]
name = "record_pages"
required-features = ["record-files", "oai"]
