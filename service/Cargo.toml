[package]
name = "open-arrow-access-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Dataset source providers for Open Arrow Access"

[features]
default = []
huggingface = [
    "dep:open-arrow-access-storage",
    "dep:opendal", "opendal/services-hf", "opendal/http-transport-reqwest",
    "dep:tokio", "dep:http", "dep:url",
]

[dependencies]
open-arrow-access-core.workspace = true
open-arrow-access-storage = { workspace = true, optional = true }
opendal = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
http = { version = "1", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { workspace = true, features = ["fs", "sync", "time"] }
futures.workspace = true
arrow-array.workspace = true
open-arrow-access-file-format = { workspace = true, features = ["parquet"] }

[lints]
workspace = true
