[package]
name = "open-arrow-access-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Dataset source providers for Open Arrow Access"

[features]
default = []
zenodo = []
dataverse = []
arxiv = ["dep:quick-xml", "dep:open-arrow-access-decompression", "open-arrow-access-decompression/tar"]
internet-archive = []
courtlistener = [
    "dep:open-arrow-access-decompression",
    "open-arrow-access-decompression/bz2",
]
gutenberg = [
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:chrono",
    "dep:xml-arrow",
]
warc = [
    "dep:open-arrow-access-dataset",
    "open-arrow-access-dataset/directory",
]
huggingface = [
    "dep:open-arrow-access-dataset",
    "dep:open-arrow-access-file-format",
    "opendal/services-hf",
    "dep:tokio",
    "tokio/fs",
    "open-arrow-access-dataset/directory",
    "open-arrow-access-file-format/parquet",
]
pmc = [
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:open-arrow-access-file-format",
    "open-arrow-access-file-format/csv",
    "dep:open-arrow-access-decompression",
    "open-arrow-access-decompression/gzip",
]

format-xml = ["dep:quick-xml"]
oai = ["format-xml"]

[dependencies]
indexmap.workspace = true
quick-xml = { workspace = true, optional = true }
reqwest.workspace = true
opendal-http-transport-reqwest.workspace = true
chrono = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
xml-arrow = { workspace = true, optional = true }
open-arrow-access-dataset = { workspace = true, optional = true }
open-arrow-access-file-format = { workspace = true, optional = true }
futures.workspace = true
open-arrow-access-core.workspace = true
open-arrow-access-storage.workspace = true
opendal = { workspace = true, features = ["services-http", "http-transport-reqwest"] }
tokio = { workspace = true, optional = true }
http.workspace = true
serde.workspace = true
serde_json.workspace = true
opendal-service-http.workspace = true
url.workspace = true
open-arrow-access-decompression = { workspace = true, optional = true }

arrow-schema = { workspace = true, optional = true }

[dev-dependencies]

futures.workspace = true
arrow-schema.workspace = true
open-arrow-access-test-support.workspace = true
arrow-array.workspace = true

open-arrow-access-decompression = { workspace = true, features = ["gzip"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["fs"] }
[[test]]
name = "huggingface"
required-features = ["huggingface"]

[[test]]
name = "gutenberg"
required-features = ["gutenberg"]

[[test]]
name = "pmc_inventory"
required-features = ["pmc"]

[[test]]
name = "pmc"
required-features = ["pmc"]

[[test]]
name = "courtlistener"
required-features = ["courtlistener"]

[lints]
workspace = true

[[test]]
name = "commoncrawl"
required-features = ["warc"]

[[test]]
name = "warc"
required-features = ["warc"]

[[test]]
name = "commoncrawl_segment"
required-features = ["warc"]

[[test]]
name = "zenodo"
required-features = ["zenodo"]

[[test]]
name = "dataverse"
required-features = ["dataverse"]

[[test]]
name = "arxiv"
required-features = ["arxiv"]

[[test]]
name = "internet_archive"
required-features = ["internet-archive"]

[[test]]
name = "xml_metadata"
required-features = ["format-xml"]

[[test]]
name = "oai"
required-features = ["oai"]
