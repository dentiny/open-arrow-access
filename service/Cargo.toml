[package]
name = "open-arrow-access-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Dataset source providers for Open Arrow Access"

[features]
default = []
gutenberg = [
    "dep:arrow-array",
    "dep:arrow-buffer",
    "dep:arrow-schema",
    "dep:arrow-select",
    "dep:chrono",
    "dep:futures",
    "dep:xml-arrow",
]
warc = [
    "dep:open-arrow-access-storage",
    "dep:opendal",
    "dep:opendal-service-http",
    "dep:url",
    "opendal/services-http",
    "opendal/http-transport-reqwest",
    "dep:open-arrow-access-dataset",
    "dep:futures",
    "open-arrow-access-dataset/directory",
]
huggingface = [
    "dep:open-arrow-access-storage",
    "dep:open-arrow-access-dataset",
    "dep:open-arrow-access-file-format",
    "dep:futures",
    "dep:opendal",
    "opendal/services-hf",
    "opendal/http-transport-reqwest",
    "dep:tokio",
    "tokio/fs",
    "dep:http",
    "dep:serde",
    "dep:serde_json",
    "dep:url",
    "open-arrow-access-dataset/directory",
    "open-arrow-access-file-format/parquet",
]
pmc = ["dep:arrow-schema", "dep:serde", "dep:serde_json"]


[dependencies]
chrono = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-buffer = { workspace = true, optional = true }
arrow-select = { workspace = true, optional = true }
xml-arrow = { workspace = true, optional = true }
open-arrow-access-dataset = { workspace = true, optional = true }
open-arrow-access-file-format = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
open-arrow-access-core.workspace = true
open-arrow-access-storage = { workspace = true, optional = true }
opendal = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
http = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
opendal-service-http = { workspace = true, optional = true }
url = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }

[dev-dependencies]

futures.workspace = true
arrow-schema.workspace = true
http.workspace = true
open-arrow-access-test-support.workspace = true
arrow-array.workspace = true

open-arrow-access-decompression = { workspace = true, features = ["gzip"] }
open-arrow-access-storage.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs"] }
[[test]]
name = "huggingface"
required-features = ["huggingface"]

[[test]]
name = "gutenberg"
required-features = ["gutenberg"]

[[test]]
name = "pmc"
required-features = ["pmc"]

[lints]
workspace = true

[[test]]
name = "commoncrawl"
required-features = ["warc"]

[[test]]
name = "warc"
required-features = ["warc"]

[[test]]
name = "commoncrawl_segment"
required-features = ["warc"]
