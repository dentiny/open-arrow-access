[package]
name = "open-arrow-access"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Composable read access to Apache Arrow streams"
repository.workspace = true

[workspace]
members = ["core", "storage", "file-format", "dataset", "decompression", "test-support", "service"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dentiny/open-arrow-access"

[workspace.metadata.lance]
repository = "https://github.com/lance-format/lance"
revision = "343aa21c460c5e17c67185c4b57bd3365a1735a1"
checked-at = "2026-11-04"

[workspace.metadata.lance.versions]
arrow = "59.3.0"
parquet = "59.3.0"
datafusion = "55.2.0"
opendal = "0.59.2"

[workspace.dependencies]
async-compression = { version = "0.4.50", default-features = false, features = ["futures-io"] }
async_zip = { version = "0.0.19", default-features = false, features = ["deflate"] }
http = "1"
indexmap = "2"
opendal-http-transport-reqwest = { version = "=0.59.2", default-features = false }
opendal-service-http = "=0.59.2"
percent-encoding = "2"
quick-xml = { version = "0.41", features = ["serialize"] }
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tar = { version = "0.4.46", default-features = false }
url = "2"
# Match the resolved Cargo.lock versions at the Lance revision above.
# See docs/dependencies.md when updating this baseline.
arrow-array = "59.3.0"
arrow-buffer = "59.3.0"
arrow-csv = "59.3.0"
arrow-json = "59.3.0"
arrow-schema = "59.3.0"
async-trait = "0.1.91"
atif-arrow = "0.4.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
warc = { package = "warc-rs", version = "=0.3.0", default-features = false }
xml-arrow = "0.2.2"

# Reserved for the generated-column layer; no crate enables DataFusion yet.
datafusion = { version = "55.2.0", default-features = false }

bytes = "1"
flate2 = "1"
futures = "0.3"
more-asserts = "0.3.1"
open-arrow-access-core = { path = "core", version = "0.1.0" }
open-arrow-access-decompression = { path = "decompression", version = "0.1.0", default-features = false }
open-arrow-access-file-format = { path = "file-format", version = "0.1.0", default-features = false }
open-arrow-access-storage = { path = "storage", version = "0.1.0", default-features = false }
open-arrow-access-test-support = { path = "test-support" }
opendal = { version = "0.59.2", default-features = false }
parquet = { version = "59.3.0", default-features = false, features = ["arrow", "async", "snap"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

open-arrow-access-dataset = { path = "dataset", version = "0.1.0", default-features = false }

open-arrow-access-service = { path = "service", version = "0.1.0", default-features = false }

[features]
dataset-directory = ["dep:open-arrow-access-dataset", "open-arrow-access-dataset/directory"]
decompression-bz2 = ["dep:open-arrow-access-decompression", "open-arrow-access-decompression/bz2"]
decompression-gzip = ["dep:open-arrow-access-decompression", "open-arrow-access-decompression/gzip"]
decompression-lz4 = ["dep:open-arrow-access-decompression", "open-arrow-access-decompression/lz4"]
decompression-tar = ["dep:open-arrow-access-decompression", "open-arrow-access-decompression/tar"]
decompression-zip = ["dep:open-arrow-access-decompression", "open-arrow-access-decompression/zip"]
decompression-zstd = ["dep:open-arrow-access-decompression", "open-arrow-access-decompression/zstd"]
default = []
format-atif = ["dep:open-arrow-access-file-format", "open-arrow-access-file-format/atif"]
format-csv = ["dep:open-arrow-access-file-format", "open-arrow-access-file-format/csv"]
format-json = ["dep:open-arrow-access-file-format", "open-arrow-access-file-format/json"]
format-parquet = ["dep:open-arrow-access-file-format", "open-arrow-access-file-format/parquet"]
format-warc = ["dep:open-arrow-access-file-format", "open-arrow-access-file-format/warc"]
format-xml = [
    "dep:open-arrow-access-file-format",
    "open-arrow-access-file-format/xml",
    "open-arrow-access-service?/format-xml",
]
service-arxiv = ["dep:open-arrow-access-service", "open-arrow-access-service/arxiv"]
service-biorxiv = ["dep:open-arrow-access-service", "open-arrow-access-service/biorxiv"]
service-courtlistener = ["dep:open-arrow-access-service", "open-arrow-access-service/courtlistener"]
service-dataverse = ["dep:open-arrow-access-service", "open-arrow-access-service/dataverse"]
service-doab = ["dep:open-arrow-access-service", "open-arrow-access-service/doab"]
service-federal-register = [
    "dep:open-arrow-access-service",
    "open-arrow-access-service/federal-register",
]
service-figshare = ["dep:open-arrow-access-service", "open-arrow-access-service/figshare"]
service-govinfo = ["dep:open-arrow-access-service", "open-arrow-access-service/govinfo"]
service-gutenberg = ["dep:open-arrow-access-service", "open-arrow-access-service/gutenberg"]
service-hathifiles = ["dep:open-arrow-access-service", "open-arrow-access-service/hathifiles"]
service-huggingface = ["dep:open-arrow-access-service", "open-arrow-access-service/huggingface"]
service-internet-archive = [
    "dep:open-arrow-access-service",
    "open-arrow-access-service/internet-archive",
]
service-library-of-congress = [
    "dep:open-arrow-access-service",
    "open-arrow-access-service/library-of-congress",
]
service-meca = ["dep:open-arrow-access-service", "open-arrow-access-service/meca"]
service-oapen = ["dep:open-arrow-access-service", "open-arrow-access-service/oapen"]
service-pmc = ["dep:open-arrow-access-service", "open-arrow-access-service/pmc"]
service-semantic-scholar = [
    "dep:open-arrow-access-service",
    "open-arrow-access-service/semantic-scholar",
]
service-uspto = ["dep:open-arrow-access-service", "open-arrow-access-service/uspto"]
service-warc = ["dep:open-arrow-access-service", "open-arrow-access-service/warc"]
service-zenodo = ["dep:open-arrow-access-service", "open-arrow-access-service/zenodo"]

[dependencies]
open-arrow-access-core.workspace = true
open-arrow-access-dataset = { workspace = true, optional = true }
open-arrow-access-decompression = { workspace = true, optional = true }
open-arrow-access-file-format = { workspace = true, optional = true }
open-arrow-access-service = { workspace = true, optional = true }
open-arrow-access-storage.workspace = true

[dev-dependencies]
opendal = { workspace = true, features = ["services-fs"] }
tokio.workspace = true

[[example]]
name = "read_huggingface"
required-features = ["service-huggingface"]

[[example]]
name = "read_gutenberg"
required-features = ["service-gutenberg"]

[[example]]
name = "read_pmc"
required-features = ["service-pmc"]

[[example]]
name = "read_parquet"
required-features = ["format-parquet"]

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true

[[example]]
name = "read_xml"
required-features = ["format-xml"]

[[example]]
name = "read_atif"
required-features = ["format-atif"]

[[example]]
name = "read_pmc_inventory"
required-features = ["service-pmc"]

[[example]]
name = "read_courtlistener"
required-features = ["service-courtlistener"]

[[example]]
name = "read_zip"
required-features = ["decompression-zip"]

[[example]]
name = "read_zenodo"
required-features = ["service-zenodo"]

[[example]]
name = "read_dataverse"
required-features = ["service-dataverse"]

[[example]]
name = "read_tar"
required-features = ["decompression-tar"]

[[example]]
name = "read_arxiv"
required-features = ["service-arxiv"]

[[example]]
name = "read_internet_archive"
required-features = ["service-internet-archive"]
