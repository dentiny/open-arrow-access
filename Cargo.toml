[package]
name = "open-arrow-access"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Composable read access to Apache Arrow streams"
repository.workspace = true

[workspace]
members = [
    "core",
    "storage",
    "file-format",
    "dataset",
    "decompression",
    "test-support",
    "service",
    "layers",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dentiny/open-arrow-access"

[workspace.metadata.compatibility]
arrow = "58"
parquet = "58"
datafusion = "54.1.0"
opendal = "0.59.2"
lance = "14.0.1"
iceberg = "0.11.0"

[workspace.dependencies]
async-compression = { version = "0.4.50", default-features = false, features = ["futures-io"] }
async_zip = { version = "0.0.19", default-features = false, features = ["deflate"] }
http = "1"
indexmap = "2"
opendal-http-transport-reqwest = { version = "=0.59.2", default-features = false }
opendal-service-http = "=0.59.2"
percent-encoding = "2"
quick-xml = { version = "0.41", features = ["serialize"] }
reqwest = { version = "0.13.5", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tar = { version = "0.4.46", default-features = false }
url = "2"
arrow-array = "58"
arrow-buffer = "58"
arrow-cast = "58"
arrow-csv = "58"
arrow-json = "58"
arrow-schema = "58"
arrow-select = "58"
async-trait = "0.1.91"
atif-arrow = "0.5"
chrono = { version = "0.4", default-features = false, features = ["std"] }
warc = { package = "warc-rs", version = "0.3.3", default-features = false }
xml-arrow = "0.3"

# Used by schema evolution expressions.
datafusion = { version = "54.1.0", default-features = false }

bytes = "1"
csv = "1.4"
csv-async = { version = "1.3", default-features = false }
flate2 = "1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
glob = "0.3.4"
memchr = "2"
more-asserts = "0.3.1"
open-arrow-access-core = { path = "core", version = "0.1.0" }
open-arrow-access-decompression = { path = "decompression", version = "0.1.0", default-features = false }
open-arrow-access-file-format = { path = "file-format", version = "0.1.0", default-features = false }
open-arrow-access-layers = { path = "layers", version = "0.1.0" }
open-arrow-access-storage = { path = "storage", version = "0.1.0", default-features = false }
open-arrow-access-test-support = { path = "test-support" }
opendal = { version = "0.59.2", default-features = false }
parquet = { version = "58", default-features = false, features = ["arrow", "async", "snap"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

open-arrow-access-dataset = { path = "dataset", version = "0.1.0", default-features = false }

open-arrow-access-service = { path = "service", version = "0.1.0", default-features = false }

[features]
dataset-directory = ["dep:open-arrow-access-dataset", "open-arrow-access-dataset/directory"]
decompression-bz2 = ["open-arrow-access-decompression/bz2"]
decompression-gzip = ["open-arrow-access-decompression/gzip"]
decompression-lz4 = ["open-arrow-access-decompression/lz4"]
decompression-tar = ["open-arrow-access-decompression/tar"]
decompression-zip = ["open-arrow-access-decompression/zip"]
decompression-zstd = ["open-arrow-access-decompression/zstd"]
default = []
format-atif = ["dep:open-arrow-access-file-format", "open-arrow-access-file-format/atif"]
format-csv = ["dep:open-arrow-access-file-format", "open-arrow-access-file-format/csv"]
format-json = ["dep:open-arrow-access-file-format", "open-arrow-access-file-format/json"]
format-parquet = ["dep:open-arrow-access-file-format", "open-arrow-access-file-format/parquet"]
format-parquet-zstd = ["format-parquet", "open-arrow-access-file-format/parquet-zstd"]
format-parquet-lz4 = ["format-parquet", "open-arrow-access-file-format/parquet-lz4"]
format-parquet-gzip = ["format-parquet", "open-arrow-access-file-format/parquet-gzip"]
format-parquet-brotli = ["format-parquet", "open-arrow-access-file-format/parquet-brotli"]
format-warc = ["dep:open-arrow-access-file-format", "open-arrow-access-file-format/warc"]
format-xml = [
    "dep:open-arrow-access-file-format",
    "open-arrow-access-file-format/xml",
    "open-arrow-access-service/format-xml",
]
service-arxiv = ["open-arrow-access-service/arxiv"]
service-bhl = ["open-arrow-access-service/bhl"]
service-biorxiv = ["open-arrow-access-service/biorxiv"]
service-courtlistener = ["open-arrow-access-service/courtlistener"]
service-dataverse = ["open-arrow-access-service/dataverse"]
service-doab = ["open-arrow-access-service/doab"]
service-federal-register = ["open-arrow-access-service/federal-register"]
service-figshare = ["open-arrow-access-service/figshare"]
service-govinfo = ["open-arrow-access-service/govinfo"]
service-gutenberg = ["open-arrow-access-service/gutenberg"]
service-hathifiles = ["open-arrow-access-service/hathifiles"]
service-huggingface = ["open-arrow-access-service/huggingface"]
service-internet-archive = ["open-arrow-access-service/internet-archive"]
service-library-of-congress = ["open-arrow-access-service/library-of-congress"]
service-meca = ["open-arrow-access-service/meca"]
service-oapen = ["open-arrow-access-service/oapen"]
service-openstax = ["open-arrow-access-service/openstax"]
service-pmc = ["open-arrow-access-service/pmc"]
service-regulations = ["open-arrow-access-service/regulations"]
service-semantic-scholar = ["open-arrow-access-service/semantic-scholar"]
service-uspto = ["open-arrow-access-service/uspto"]
service-warc = ["open-arrow-access-service/warc"]
service-zenodo = ["open-arrow-access-service/zenodo"]

[dependencies]
open-arrow-access-core.workspace = true
open-arrow-access-dataset = { workspace = true, optional = true }
open-arrow-access-decompression.workspace = true
open-arrow-access-file-format = { workspace = true, optional = true }
open-arrow-access-layers.workspace = true
open-arrow-access-service.workspace = true
open-arrow-access-storage.workspace = true

[dev-dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
datafusion.workspace = true
open-arrow-access-test-support.workspace = true
opendal = { workspace = true, features = ["services-fs"] }
tokio.workspace = true
tempfile.workspace = true

[[test]]
name = "file_source_formats"
required-features = ["format-csv", "format-json", "format-xml", "format-parquet", "decompression-gzip"]

[[example]]
name = "read_huggingface"
required-features = ["service-huggingface"]

[[example]]
name = "read_gutenberg"
required-features = ["service-gutenberg"]

[[example]]
name = "read_pmc"
required-features = ["service-pmc"]

[[example]]
name = "read_parquet"
required-features = ["format-parquet"]

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true

[[example]]
name = "read_xml"
required-features = ["format-xml"]

[[example]]
name = "read_atif"
required-features = ["format-atif"]

[[example]]
name = "read_pmc_inventory"
required-features = ["service-pmc"]

[[example]]
name = "read_courtlistener"
required-features = ["service-courtlistener"]

[[example]]
name = "read_zip"
required-features = ["decompression-zip"]

[[example]]
name = "read_zenodo"
required-features = ["service-zenodo"]

[[example]]
name = "read_dataverse"
required-features = ["service-dataverse"]

[[example]]
name = "read_tar"
required-features = ["decompression-tar"]

[[example]]
name = "read_arxiv"
required-features = ["service-arxiv"]

[[example]]
name = "read_internet_archive"
required-features = ["service-internet-archive"]

[[example]]
name = "schema_evolution"
required-features = ["format-json"]

[[example]]
name = "generated_columns"
required-features = ["format-json"]

[[example]]
name = "parallel_sampling"
required-features = ["format-json"]
