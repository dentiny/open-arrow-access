[package]
name = "open-arrow-access-benchmarks"
version.workspace = true
edition.workspace = true
publish = false

[features]
allocation-stats = ["dep:stats_alloc"]
s3 = ["opendal/services-s3"]

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
futures.workspace = true
open-arrow-access-core.workspace = true
open-arrow-access-file-format = { workspace = true, features = [
    "csv",
    "json",
    "xml",
    "atif",
    "warc",
    "parquet",
] }
open-arrow-access-storage.workspace = true
opendal = { workspace = true, features = [
    "services-fs",
    "services-memory",
    "services-http",
    "http-transport-reqwest",
] }
parquet.workspace = true
serde_json.workspace = true
stats_alloc = { version = "0.1.10", optional = true }
tokio.workspace = true

[lints]
workspace = true
