[package]
name = "open-arrow-access-file-format"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Arrow file-format readers for Open Arrow Access"

[features]
atif = ["dep:atif-arrow", "dep:futures"]
csv = ["dep:arrow-csv", "dep:arrow-schema", "dep:futures", "dep:csv-core"]
default = []
json = ["dep:arrow-json", "dep:arrow-schema", "dep:futures"]
parquet = ["dep:parquet", "dep:arrow-schema", "dep:futures"]
warc = ["dep:warc", "dep:futures", "dep:arrow-schema"]
xml = ["dep:xml-arrow", "dep:futures"]

[dependencies]
csv-core = { version = "0.1.13", optional = true }
arrow-csv = { workspace = true, optional = true }
arrow-json = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
atif-arrow = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
open-arrow-access-core.workspace = true
parquet = { workspace = true, optional = true }
warc = { workspace = true, optional = true }
xml-arrow = { workspace = true, optional = true }

[dev-dependencies]
flate2.workspace = true
open-arrow-access-decompression = { workspace = true, features = ["gzip"] }
open-arrow-access-layers.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
futures.workspace = true
more-asserts.workspace = true
open-arrow-access-storage.workspace = true
open-arrow-access-test-support.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs"] }

[[test]]
name = "json"
required-features = ["json"]

[lints]
workspace = true

[[test]]
name = "atif"
required-features = ["atif"]

[[test]]
name = "csv"
required-features = ["csv"]

[[test]]
name = "xml"
required-features = ["xml"]

[[test]]
name = "warc"
required-features = ["warc"]

[[test]]
name = "parquet"
required-features = ["parquet"]

[[test]]
name = "document"
required-features = ["json", "xml", "csv"]
