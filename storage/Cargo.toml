[package]
name = "open-arrow-access-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Storage adapters for Open Arrow Access"

[features]
default = []

[dependencies]
futures.workspace = true
http.workspace = true
httpdate = "1"
indexmap.workspace = true
open-arrow-access-core.workspace = true
opendal = { workspace = true, features = ["executors-tokio", "layers-retry", "layers-timeout"] }
opendal-layer-observe-metrics-common = "0.59.5"
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
more-asserts.workspace = true
open-arrow-access-test-support.workspace = true
opendal-service-http.workspace = true
rstest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "test-util"] }

[lints]
workspace = true
