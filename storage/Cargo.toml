[package]
name = "open-arrow-access-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Storage adapters for Open Arrow Access"

[features]
default = []
opendal = ["dep:opendal", "dep:tokio", "dep:futures", "opendal/executors-tokio"]
fs = ["opendal", "opendal/services-fs"]

[dependencies]
open-arrow-access-core.workspace = true
opendal = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync"] }
futures = { workspace = true, optional = true }

[dev-dependencies]
more-asserts.workspace = true
tempfile.workspace = true

[lints]
workspace = true
