[package]
name = "open-arrow-access-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Storage adapters for Open Arrow Access"

[features]
default = []

[dependencies]
futures.workspace = true
indexmap.workspace = true
open-arrow-access-core.workspace = true
opendal = { workspace = true, features = ["executors-tokio", "layers-retry", "layers-timeout"] }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
http.workspace = true
more-asserts.workspace = true
open-arrow-access-test-support.workspace = true
opendal-service-http.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
