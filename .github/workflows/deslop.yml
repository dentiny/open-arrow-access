name: Architecture lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deslop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deslop:
    name: deslop-please
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Install deslop-please
        run: make install-deslop
      - name: Check architecture against reviewed baseline
        run: make lint-deslop
