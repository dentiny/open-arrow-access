name: Layer features

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  feature-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: make check-layer-features
      - run: cargo check --workspace --all-targets --all-features --locked

  layer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: clippy
      - run: cargo test -p open-arrow-access-layers --all-features --locked
      - run: cargo clippy -p open-arrow-access-layers --all-targets --all-features --locked -- -D warnings
