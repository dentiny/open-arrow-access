[package]
name = "open-arrow-access-layers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Composable Arrow record layers for Open Arrow Access"

[dependencies]
datafusion = { workspace = true, features = ["sql", "string_expressions", "unicode_expressions", "datetime_expressions", "math_expressions", "recursive_protection"] }
futures.workspace = true
arrow-array = { workspace = true, features = ["chrono-tz"] }
arrow-cast.workspace = true
arrow-schema.workspace = true
open-arrow-access-core.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
open-arrow-access-file-format = { workspace = true, features = ["csv"] }
open-arrow-access-test-support.workspace = true

[lints]
workspace = true

[[test]]
name = "type_conversion"

[[test]]
name = "generated_columns"
