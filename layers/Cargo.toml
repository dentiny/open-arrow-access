[package]
name = "open-arrow-access-layers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Composable Arrow record layers for Open Arrow Access"

[dependencies]
datafusion = { workspace = true, features = ["sql"] }
futures.workspace = true
indexmap.workspace = true
arrow-array = { workspace = true, features = ["chrono-tz"] }
arrow-cast.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
open-arrow-access-core.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
open-arrow-access-file-format = { path = "../file-format", default-features = false, features = ["csv"] }
open-arrow-access-test-support.workspace = true

[lints]
workspace = true

[[test]]
name = "schema_evolution"

[[test]]
name = "schema_evolution_sql"
